apiVersion: v1
kind: ConfigMap
metadata:
  name: microbus-config
  namespace: microbus
data:
  config.yaml: |
    http.ingress.core:
      Ports: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microbus-app
  namespace: microbus
  labels:
    app: microbus-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: microbus-app
  template:
    metadata:
      labels:
        app: microbus-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: microbus-app
        image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/microbus-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: NATS_URL
          value: "nats://nats.microbus.svc.cluster.local:4222"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://grafana.microbus.svc.cluster.local:4317"
        - name: HTTP_PORT
          value: "8080"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: config
          mountPath: /home/microbus/config.yaml
          subPath: config.yaml
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: microbus-config
---
apiVersion: v1
kind: Service
metadata:
  name: microbus-app
  namespace: microbus
  labels:
    app: microbus-app
spec:
  type: LoadBalancer
  selector:
    app: microbus-app
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  sessionAffinity: None
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: microbus-app-hpa
  namespace: microbus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: microbus-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max

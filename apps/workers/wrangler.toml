name = "daad-workers"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Bind a KV Namespace for caching
[[kv_namespaces]]
binding = "DAAD_CACHE"
id = "daad_cache_namespace"
preview_id = "daad_cache_preview"

# Bind an R2 Bucket
# [[r2_buckets]]
# binding = "DAAD_BUCKET"
# bucket_name = "daad-diagrams"

# Environment variables (use wrangler secret put for sensitive values)
[vars]
CACHE_ENABLED = "true"
CACHE_DEFAULT_TTL = "604800"

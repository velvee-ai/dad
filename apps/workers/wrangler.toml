name = "daad-workers"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# R2 Buckets for preview diagram storage
[[r2_buckets]]
binding = "PREVIEW_DIAGRAMS"
bucket_name = "daad-preview-diagrams"
preview_bucket_name = "daad-preview-diagrams-dev"

# Environment-specific configurations
[env.production]
name = "daad-workers"
[[env.production.r2_buckets]]
binding = "PREVIEW_DIAGRAMS"
bucket_name = "daad-preview-diagrams"

[env.development]
name = "daad-workers-dev"
[[env.development.r2_buckets]]
binding = "PREVIEW_DIAGRAMS"
bucket_name = "daad-preview-diagrams-dev"

# Environment variables
# Use `wrangler secret put OPENROUTER_API_KEY` for production
# Use `wrangler secret put CLAUDE_API_KEY` for production
[vars]
ENVIRONMENT = "development"
CORS_ORIGINS = "*"

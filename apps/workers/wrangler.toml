name = "daad-workers"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Bind a KV Namespace
# [[kv_namespaces]]
# binding = "DAAD_KV"
# id = "your-kv-namespace-id"

# Bind an R2 Bucket for preview storage
[[r2_buckets]]
binding = "PREVIEW_BUCKET"
bucket_name = "daad-previews"
preview_bucket_name = "daad-previews-dev"

# Environment variables (use wrangler secret put for sensitive values)
# [vars]
# ENVIRONMENT = "development"

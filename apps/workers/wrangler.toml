name = "daad-workers"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Bind a KV Namespace
# [[kv_namespaces]]
# binding = "DAAD_KV"
# id = "your-kv-namespace-id"

# Bind an R2 Bucket for preview sessions and diagrams
[[r2_buckets]]
binding = "DAAD_BUCKET"
bucket_name = "daad-diagrams"
preview_bucket_name = "daad-diagrams-preview" # Optional: separate bucket for dev

# Environment variables (use wrangler secret put for sensitive values)
[vars]
# Set to "true" to enable dry-run mode for cleanup (no actual deletions)
DRY_RUN = "false"

# Scheduled cleanup worker - runs daily at 2 AM UTC
[triggers]
crons = ["0 2 * * *"]

name = "daad-workers"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Cloudflare Analytics Engine binding for metrics
[[analytics_engine_datasets]]
binding = "ANALYTICS"
# Dataset will be automatically created when first used

# R2 Buckets for preview diagram storage
[[r2_buckets]]
binding = "PREVIEW_DIAGRAMS"
bucket_name = "daad-preview-diagrams"
preview_bucket_name = "daad-preview-diagrams-dev"

# R2 Bucket for general storage (cleanup worker target)
[[r2_buckets]]
binding = "DAAD_BUCKET"
bucket_name = "daad-diagrams"
preview_bucket_name = "daad-diagrams-preview"

# Environment variables
# Use `wrangler secret put OPENROUTER_API_KEY` for production
# Use `wrangler secret put CLAUDE_API_KEY` for production
[vars]
ENVIRONMENT = "development"
CORS_ORIGINS = "*"
LOG_LEVEL = "INFO"
# Set to "true" to enable dry-run mode for cleanup (no actual deletions)
DRY_RUN = "false"

# Optional: Webhook for alert notifications
# ALERT_WEBHOOK_URL = "https://your-webhook-url.com"

# Scheduled cleanup worker - runs daily at 2 AM UTC
[triggers]
crons = ["0 2 * * *"]

# Environment-specific configurations
[env.production]
name = "daad-workers"
[[env.production.r2_buckets]]
binding = "PREVIEW_DIAGRAMS"
bucket_name = "daad-preview-diagrams"

[[env.production.r2_buckets]]
binding = "DAAD_BUCKET"
bucket_name = "daad-diagrams"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"

[env.production.vars]
ENVIRONMENT = "production"
DRY_RUN = "false"
LOG_LEVEL = "INFO"

[env.development]
name = "daad-workers-dev"
[[env.development.r2_buckets]]
binding = "PREVIEW_DIAGRAMS"
bucket_name = "daad-preview-diagrams-dev"

[[env.development.r2_buckets]]
binding = "DAAD_BUCKET"
bucket_name = "daad-diagrams-preview"

[[env.development.analytics_engine_datasets]]
binding = "ANALYTICS"

[env.development.vars]
ENVIRONMENT = "development"
CORS_ORIGINS = "*"
DRY_RUN = "true"
LOG_LEVEL = "DEBUG"

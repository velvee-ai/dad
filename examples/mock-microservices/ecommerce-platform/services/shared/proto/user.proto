syntax = "proto3";

package acme.user;

// UserService defines the gRPC interface for user operations.
// Used by api-gateway to authenticate and look up users without REST overhead.
service UserService {
  // Validates credentials and returns a JWT token
  rpc Authenticate (AuthRequest) returns (AuthResponse);

  // Gets user profile by ID
  rpc GetUser (GetUserRequest) returns (UserResponse);

  // Validates a JWT token and returns the user info
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
}

message AuthRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  bool success = 1;
  string token = 2;
  string refresh_token = 3;
  string error = 4;
  UserInfo user = 5;
}

message GetUserRequest {
  string user_id = 1;
}

message UserResponse {
  UserInfo user = 1;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
  string role = 4;
}

message UserInfo {
  string id = 1;
  string email = 2;
  string name = 3;
  string role = 4;
  string created_at = 5;
}

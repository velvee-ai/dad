name: Generate Diagrams

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '.dad/**'
      - '**.md'
      - '.github/workflows/**'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Generation mode'
        required: true
        type: choice
        options:
          - incremental
          - full
        default: incremental

permissions:
  contents: write

jobs:
  generate-diagrams:
    name: Generate DAD Diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diagrams
        id: generate
        uses: ./.github/actions/generate-diagrams
        with:
          mode: ${{ inputs.mode || 'incremental' }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          commit-changes: true

      - name: Output summary
        if: always()
        run: |
          echo "### 🎉 Workflow Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Files processed**: ${{ steps.generate.outputs.files-changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Diagrams generated**: ${{ steps.generate.outputs.diagrams-generated }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes committed**: ${{ steps.generate.outputs.changes-committed }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.generate.outputs.commit-sha }}" ]; then
            echo "- **Commit SHA**: \`${{ steps.generate.outputs.commit-sha }}\`" >> $GITHUB_STEP_SUMMARY
          fi

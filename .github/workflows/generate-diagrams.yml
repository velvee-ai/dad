name: Generate Diagrams

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '.daad/**'
      - '**.md'
      - '.github/workflows/**'

  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force regenerate all diagrams'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  generate-diagrams:
    name: Generate DAAD Diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: apps/cli/go.sum

      - name: Cache Go dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('apps/cli/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install DAAD CLI
        working-directory: apps/cli
        run: |
          echo "Building DAAD CLI..."
          make build
          echo "Installing DAAD CLI to /usr/local/bin..."
          sudo cp bin/daad /usr/local/bin/
          echo "Verifying installation..."
          daad version

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate diagrams (incremental)
        if: ${{ !inputs.force_regenerate }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          echo "Running incremental diagram generation..."

          # Get list of changed files since last commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(ts|js|tsx|jsx|go|py|java|rb|rs)$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No code files changed, skipping diagram generation"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Generate diagrams for changed files
          # TODO: Update this command when CLI implements incremental generation
          echo "Diagram generation would run here for:"
          echo "$CHANGED_FILES"

          # For now, just create a placeholder to demonstrate the workflow
          mkdir -p .daad
          echo "{\"workflow\": \"test\", \"timestamp\": \"$(date -Iseconds)\"}" > .daad/workflow-test.json

      - name: Generate all diagrams (forced)
        if: ${{ inputs.force_regenerate }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          echo "Running full diagram regeneration..."
          # TODO: Update this command when CLI implements full regeneration
          echo "Full diagram generation would run here"

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain .daad/)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Diagram changes detected"
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No diagram changes"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git add .daad/
          git commit -m "docs: update diagrams [skip ci]

          Auto-generated by DAAD CLI via GitHub Actions

          Workflow: ${{ github.workflow }}
          Run: ${{ github.run_number }}
          Commit: ${{ github.sha }}"

          # Push with retry logic
          for i in {1..3}; do
            if git push; then
              echo "Successfully pushed changes"
              exit 0
            fi
            echo "Push failed, attempt $i/3"
            sleep 2
            git pull --rebase
          done

          echo "Failed to push after 3 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## Diagram Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow**: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes Detected**: ${{ steps.check_changes.outputs.changes }}" >> $GITHUB_STEP_SUMMARY

          if [ -d ".daad" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            ls -lh .daad/ >> $GITHUB_STEP_SUMMARY || echo "No files in .daad/" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
